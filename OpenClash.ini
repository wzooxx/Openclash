[custom]

;ruleset=➡️ 国内,[]SRC-IP-CIDR,192.168.100.246/32
ruleset=🌍 国外,[]DOMAIN-SUFFIX,browserleaks.com

;1、基础直连
ruleset=➡️ 国内,[]DOMAIN-SUFFIX,local
ruleset=➡️ 国内,[]DOMAIN-SUFFIX,localhost
ruleset=➡️ 国内,[]DOMAIN-SUFFIX,lan
ruleset=➡️ 国内,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=➡️ 国内,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=➡️ 国内,[]IP-CIDR,172.16.0.0/12,no-resolve
