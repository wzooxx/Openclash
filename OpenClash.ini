;3、国外分流
; 最高优先级：需要特殊节点的应用
ruleset=👽 AI1,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/AI.list
ruleset=👽 AI1,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/AI2.list
ruleset=👽 AI2,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=📘 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=🙋 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=👯‍♂️ TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

; 下载/网盘类，PikPak 单独出来
ruleset=Pikpak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PikPak/PikPak.list

; 流媒体：可以识别细，但统一走一个“流媒体”组
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
ruleset=📀 流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

; 兜底国外
ruleset=🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Check.list
ruleset=🌍 国外,https://raw.githubusercontent.com/liandu2024/clash/refs/heads/main/list/Proxy.list
ruleset=🌍 国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

;4、兜底规则
ruleset=➡️ 国内,[]GEOIP,CN
ruleset=🌍 国外,[]FINAL

;5、策略组
custom_proxy_group=👽 AI1`select`[]港台日新韩-自动`[]台日新韩-自动`[]美国-自动`[]所有-自动`[]DIRECT`[]REJECT
custom_proxy_group=👽 AI2`select`[]港台日新韩-自动`[]台日新韩-自动`[]美国-自动`[]所有-自动`[]DIRECT`[]REJECT
custom_proxy_group=📘 GitHub`select`[]所有-自动`[]港台日新韩-自动`[]香港-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]DIRECT`[]REJECT
custom_proxy_group=Pikpak`select`[]所有-自动`[]港台日新韩-自动`[]香港-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]DIRECT`[]REJECT
custom_proxy_group=👯‍♂️ TikTok`select`[]台日新韩-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]所有-自动`[]DIRECT`[]REJECT
custom_proxy_group=🙋 Telegram`select`[]港台日新韩-自动`[]香港-自动`[]新加坡-自动`[]日本-自动`[]美国-自动`[]所有-自动`[]DIRECT`[]REJECT
custom_proxy_group=📀 流媒体`select`[]港台日新韩-自动`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]所有-自动`[]DIRECT`[]REJECT
custom_proxy_group=🌍 国外`select`[]所有-自动`[]港台日新韩-自动`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]其他-自动`[]DIRECT`[]REJECT
custom_proxy_group=➡️ 国内`select`[]DIRECT`[]所有-自动`[]REJECT

