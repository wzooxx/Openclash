[custom]
; H28K / iStoreOS / OpenClash 分流模板 V2
; 这份文件只负责“规则分流和策略组”，不负责 DNS 防泄漏。
; DNS 防泄漏请同时按照同目录《OpenClash_DNS防泄漏设置说明.txt》设置。
; V2 主要调整：
; 1. 保留并补强 Google / Google Play 专用分流。
; 2. 删除伪“泄露拦截”：不再屏蔽检测网站，也不再粗暴拦截所有 STUN。
; 3. Apple、Microsoft、下载流量单独分组，避免被永久写死为直连。
; 4. 新增“全部-手动”和“全部-自动”，节点名称不规范时也能找到节点。
; 5. 删除主要代理组中的 REJECT，减少小白误选后网站完全打不开。
; 6. 国内仍默认 DIRECT，国外仍默认香港自动。

; 1. 本地和局域网：必须直连
; ============================================================

; 2. Google / Google Play：必须排在 China 和 Download 前面
; Google Play 下载时会同时访问商店、接口、图片和安装包 CDN。
; 这些域名若一部分代理、一部分直连，常见现象就是能打开商店却下不动
ruleset=Google,[]DOMAIN-SUFFIX,google.com
ruleset=Google,[]DOMAIN-SUFFIX,googleapis.com
ruleset=Google,[]DOMAIN-SUFFIX,googleapis.cn
ruleset=Google,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=Google,[]DOMAIN-SUFFIX,gstatic.com
ruleset=Google,[]DOMAIN-SUFFIX,ggpht.com
ruleset=Google,[]DOMAIN-SUFFIX,gvt1.com
ruleset=Google,[]DOMAIN-SUFFIX,gvt2.com
ruleset=Google,[]DOMAIN-SUFFIX,gvt3.com
ruleset=Google,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=Google,[]DOMAIN,android.clients.google.com
ruleset=Google,[]DOMAIN,c.android.clients.google.com
ruleset=Google,[]DOMAIN,play.googleapis.com
ruleset=Google,[]DOMAIN,play-fe.googleapis.com
ruleset=Google,[]DOMAIN,android.googleapis.com
ruleset=Google,[]DOMAIN,mtalk.google.com

; 3. 特殊应用：先匹配，防止被后面的国内或通用规则抢先命中
ruleset=AI,https://raw.githubusercontent.com/liandu2024/clash/main/list/AI.list
ruleset=AI,https://raw.githubusercontent.com/liandu2024/clash/main/list/AI2.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

ruleset=GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=GitHub,[]DOMAIN-SUFFIX,github.com
ruleset=GitHub,[]DOMAIN-SUFFIX,github.io
ruleset=GitHub,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubassets.com
ruleset=GitHub,[]DOMAIN-SUFFIX,raw.githubusercontent.com
ruleset=GitHub,[]DOMAIN-SUFFIX,objects.githubusercontent.com

ruleset=Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PikPak/PikPak.list

ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
ruleset=流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PrimeVideo/PrimeVideo.list

; Apple 和 Microsoft 有国内 CDN，也有海外服务。
; 单独分组后默认直连；遇到 iCloud、Copilot、OneDrive 等异常时可手动切到国外。
ruleset=Apple,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
ruleset=Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list

; 4. 国内常用：国内域名和 CDN 默认直连
ruleset=国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
ruleset=国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
ruleset=国内,[]DOMAIN-SUFFIX,cn
ruleset=国内,[]DOMAIN-SUFFIX,gov.cn
ruleset=国内,[]DOMAIN-SUFFIX,edu.cn
ruleset=国内,[]DOMAIN-SUFFIX,ac.cn
ruleset=国内,[]DOMAIN-SUFFIX,com.cn
ruleset=国内,[]DOMAIN-SUFFIX,net.cn
ruleset=国内,[]DOMAIN-SUFFIX,org.cn
ruleset=国内,[]DOMAIN-SUFFIX,aliyuncs.com
ruleset=国内,[]DOMAIN-SUFFIX,myqcloud.com
ruleset=国内,[]DOMAIN-SUFFIX,qcloud.com
ruleset=国内,[]DOMAIN-SUFFIX,bdstatic.com
ruleset=国内,[]DOMAIN-SUFFIX,bcebos.com
ruleset=国内,[]DOMAIN-SUFFIX,byteimg.com
ruleset=国内,[]DOMAIN-SUFFIX,bytecdn.cn
ruleset=国内,[]DOMAIN-SUFFIX,douyinpic.com

; Download 放在 Google、GitHub 和国内规则之后。
; 默认直连；如果某个国外下载站直连失败，在面板把“下载”改为“国外”。
ruleset=下载,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list

; 5. 国外通用和最终兜底
; 第一条命中的规则生效，所以 GEOIP,CN 必须放在 FINAL 前面。
ruleset=国外,https://raw.githubusercontent.com/liandu2024/clash/main/list/Check.list
ruleset=国外,https://raw.githubusercontent.com/liandu2024/clash/main/list/Proxy.list
ruleset=国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list
ruleset=国内,[]GEOIP,CN
ruleset=国外,[]FINAL

; 6. 策略组
; ruleset 决定“流量属于哪个组”；custom_proxy_group 决定“这个组走哪里”。
; Google 不提供 DIRECT 和 REJECT，避免误选后 Google Play 再次失败。
custom_proxy_group=Google`select`[]香港-自动`[]日本-自动`[]新加坡-自动`[]台湾-自动`[]韩国-自动`[]美国-自动`[]国外`[]全部-手动

; AI 默认美国节点；常见 AI 服务对出口地区要求较严格。
custom_proxy_group=AI`select`[]美国-自动`[]日本-自动`[]新加坡-自动`[]台湾-自动`[]韩国-自动`[]香港-自动`[]国外`[]全部-手动
custom_proxy_group=GitHub`select`[]国外`[]香港-自动`[]日本-自动`[]新加坡-自动`[]台湾-自动`[]韩国-自动`[]美国-自动`[]全部-手动`[]DIRECT
custom_proxy_group=Telegram`select`[]新加坡-自动`[]香港-自动`[]日本-自动`[]台湾-自动`[]韩国-自动`[]美国-自动`[]国外`[]全部-手动
custom_proxy_group=TikTok`select`[]日本-自动`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]韩国-自动`[]香港-自动`[]国外`[]全部-手动
custom_proxy_group=PikPak`select`[]香港-自动`[]新加坡-自动`[]日本-自动`[]台湾-自动`[]韩国-自动`[]美国-自动`[]国外`[]全部-手动
custom_proxy_group=流媒体`select`[]国外`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]全部-手动`[]DIRECT

; Apple、Microsoft 默认直连，需要海外出口时再手动切换。
custom_proxy_group=Apple`select`[]DIRECT`[]国外`[]香港-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]全部-手动
custom_proxy_group=Microsoft`select`[]DIRECT`[]国外`[]香港-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]全部-手动

custom_proxy_group=下载`select`[]DIRECT`[]国外`[]全部-手动
custom_proxy_group=国外`select`[]香港-自动`[]日本-自动`[]新加坡-自动`[]台湾-自动`[]韩国-自动`[]美国-自动`[]全部-自动`[]全部-手动`[]DIRECT

; 国内只保留 DIRECT，避免误操作让国内网站绕路或被拒绝。
custom_proxy_group=国内`select`[]DIRECT


; ============================================================
; 7. 节点组
; “全部-手动”用 .* 收录所有节点，解决节点命名不在地区关键词内时无处可选。
; ============================================================
custom_proxy_group=全部-手动`select`.*
custom_proxy_group=全部-自动`url-test`.*`http://www.gstatic.com/generate_204`300,20,100
custom_proxy_group=香港-自动`url-test`(香港|港|HK|Hong Kong|HongKong)`http://www.gstatic.com/generate_204`300,20,100
custom_proxy_group=台湾-自动`url-test`(台湾|台灣|台|TW|Taiwan|Tai Wan)`http://www.gstatic.com/generate_204`300,20,100
custom_proxy_group=日本-自动`url-test`(日本|日|JP|Japan|东京|大阪)`http://www.gstatic.com/generate_204`300,20,100
custom_proxy_group=新加坡-自动`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,20,100
custom_proxy_group=韩国-自动`url-test`(韩国|韓國|韩|KR|Korea|首尔)`http://www.gstatic.com/generate_204`300,20,100
custom_proxy_group=美国-自动`url-test`(美国|美|US|United States|洛杉矶|西雅图|达拉斯|圣何塞|纽约)`http://www.gstatic.com/generate_204`300,20,100
; 其他国家手动组：
; 如果你的机场节点名字里有英国、德国、法国等关键词，会出现在这里。
custom_proxy_group=其他-手动`select`(英国|UK|United Kingdom|德国|Germany|法国|France|加拿大|Canada|印度|India|越南|Vietnam|泰国|Thailand|马来西亚|Malaysia|菲律宾|Philippines|印尼|Indonesia|土耳其|Turkey|澳大利亚|Australia|俄罗斯|Russia)`[]DIRECT`[]REJECT

; ============================================================
; 8. 生成规则
; ============================================================
enable_rule_generator=true
overwrite_original_rules=true


; ============================================================
; 使用提醒
; 1. 生成配置后，Google 先选“香港-自动”；不行再试日本或新加坡。
; 2. “国内”保持 DIRECT；“国外”保持香港/日本/新加坡自动之一。
; 3. 视频会议、语音和游戏不会再被 DOMAIN-KEYWORD,stun 一刀切拦截。
; 4. dnsleaktest.com、browserleaks.com 现在可以正常打开，用于真实检测。
; 5. 192.168.100.1:8088 是你原配置的本地 GitHub 加速入口；它停掉会导致规则更新失败。
